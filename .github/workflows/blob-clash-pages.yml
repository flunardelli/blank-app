name: Deploy Blob Clash to GitHub Pages

on:
  push:
    branches: [main, feat/blob-clash-3d]
    paths: ['blob-clash/**', '.github/workflows/blob-clash-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        working-directory: blob-clash
        run: npm test

      - name: Publish static files to gh-pages
        run: |
          site=$(mktemp -d)
          cp -r blob-clash/index.html blob-clash/style.css blob-clash/src "$site"/
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
