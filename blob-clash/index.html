<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#62c6ff">
  <title>Blob Clash 3D</title>
  <link rel="preload" href="vendor/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="bubbles"></div>

  <header id="topbar">
    <div id="progress-wrap">
      <div id="progress"><div id="progress-fill"></div></div>
      <div class="flag"></div>
    </div>
    <div id="coins"><span id="coins-value" class="ink">0</span><i class="coin-icon big"></i></div>
  </header>

  <section id="menu" class="screen" hidden>
    <h1 id="menu-level" class="ink title">Level 1</h1>
    <div class="hint">
      <p class="ink">Hold&amp;Drag to move</p>
      <div class="hint-track"><span class="hint-hand">👆</span></div>
    </div>
    <div id="upgrade-cards"></div>
  </section>

  <section id="complete" class="screen dim" hidden>
    <div id="confetti"></div>
    <h1 class="stacked"><span id="complete-level" class="ink">Level 1</span><span class="ink big yellow">COMPLETE!</span></h1>
    <div class="reward">
      <i class="coin-icon huge"></i>
      <span id="complete-coins" class="ink">0</span>
      <span id="complete-multiplier" class="pill">x1.0</span>
    </div>
    <button id="complete-next" class="btn cyan ink">NEXT</button>
  </section>

  <section id="lose" class="screen dim" hidden>
    <h1 class="stacked"><span class="ink">You</span><span class="ink big orange">LOSE!</span></h1>
    <div class="reward"><span id="lose-coins" class="ink">+0</span><i class="coin-icon huge"></i></div>
    <button id="lose-continue" class="btn cyan ink">CONTINUE</button>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
