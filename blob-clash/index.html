<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#62c6ff">
  <title>Blob Clash 3D</title>
  <link rel="preload" href="vendor/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="bubbles"></div>

  <header id="topbar">
    <div id="keys"><i class="key-slot"></i><i class="key-slot"></i><i class="key-slot"></i></div>
    <div id="progress-wrap">
      <div id="level-badge" class="ink">1</div>
      <div id="progress"><div id="progress-fill"></div></div>
      <div class="flag"></div>
    </div>
    <button id="pause-btn" aria-label="Pause" hidden><i></i><i></i></button>
    <div id="coins"><span id="coins-value" class="ink">0</span><i class="coin-icon big"></i></div>
  </header>

  <section id="fight" hidden>
    <div class="fight-bars">
      <div class="fighter"><i class="blob-icon player"></i><div class="hp"><div id="hp-player"></div></div></div>
      <div class="fighter boss"><div class="hp"><div id="hp-boss"></div></div><i class="blob-icon boss"></i></div>
    </div>
    <div class="tap-hint">
      <div class="tap-hand"><span class="ripple"></span>👆</div>
      <p class="outline">TAP TO FIGHT!</p>
    </div>
  </section>

  <div id="banner" class="ink" hidden></div>
  <div id="pop" class="ink" hidden></div>

  <section id="title" class="screen" hidden>
    <h1 class="stacked logo"><span class="ink">BLOB</span><span class="ink big yellow">CLASH</span></h1>
    <div id="title-buttons">
      <button id="title-continue" class="btn cyan ink">CONTINUAR</button>
      <button id="title-new" class="btn pink ink">NOVO JOGO</button>
    </div>
    <div id="title-confirm" class="panel" hidden>
      <p class="ink">Apagar seu progresso, moedas e melhorias e começar do zero?</p>
      <div class="row">
        <button id="title-confirm-yes" class="btn pink small ink">APAGAR</button>
        <button id="title-confirm-no" class="btn cyan small ink">VOLTAR</button>
      </div>
    </div>
  </section>

  <section id="menu" class="screen" hidden>
    <h1 id="menu-level" class="ink title">Level 1</h1>
    <div class="hint">
      <p class="ink">Hold&amp;Drag to move</p>
      <div class="hint-track"><span class="hint-hand">👆</span></div>
    </div>
    <div id="upgrade-cards"></div>
  </section>

  <section id="complete" class="screen dim" hidden>
    <div id="confetti"></div>
    <h1 class="stacked"><span id="complete-level" class="ink">Level 1</span><span class="ink big yellow">COMPLETE!</span></h1>
    <div class="reward">
      <i class="coin-icon huge"></i>
      <span id="complete-coins" class="ink">0</span>
      <span id="complete-multiplier" class="pill">x1.0</span>
    </div>
    <div id="complete-chest" class="chest ink" hidden>🎁 <span></span></div>
    <button id="complete-next" class="btn cyan ink">NEXT</button>
  </section>

  <section id="lose" class="screen dim" hidden>
    <h1 class="stacked"><span class="ink">You</span><span class="ink big orange">LOSE!</span></h1>
    <div class="reward"><span id="lose-coins" class="ink">+0</span><i class="coin-icon huge"></i></div>
    <button id="lose-continue" class="btn cyan ink">CONTINUE</button>
  </section>

  <section id="pause" class="screen dim" hidden>
    <h1 class="stacked"><span class="ink big">PAUSED</span></h1>
    <button id="pause-resume" class="btn cyan ink">CONTINUE</button>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
